body{background:var(--surround);display:flex;flex-direction:column;font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;color:var(--navy);overflow:hidden}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
#stage{display:block;max-width:100%;max-height:100%;aspect-ratio:16/9;width:auto;height:100%;background:#fff;box-shadow:0 1px 0 rgba(20,46,97,.18),0 18px 50px -18px rgba(10,23,48,.5)}
@media (max-aspect-ratio:16/9){#stage{width:100%;height:auto}}
body.embed #wrap{padding:0} body.embed #stage{box-shadow:none}
body.export #wrap{padding:0} body.export #bar{display:none} body.export #stage{box-shadow:none}
#bar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--bar);color:var(--bar-text);font:500 12px/1 'Space Grotesk','Helvetica Neue',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
#bar button{appearance:none;border:1px solid rgba(255,255,255,.45);border-radius:4px;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:9px 14px;cursor:pointer;min-width:84px}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar button:focus-visible,#scrub:focus-visible{outline:2px solid #7fb0ff;outline-offset:3px}
#scrub{flex:1;min-width:60px;appearance:none;height:22px;background:transparent;cursor:pointer;margin:0}
#scrub::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.45)}
#scrub::-moz-range-track{height:2px;background:rgba(255,255,255,.45)}
#scrub::-webkit-slider-thumb{appearance:none;width:14px;height:14px;margin-top:-6px;border-radius:50%;background:#2a7dff;border:2px solid #fff}
#scrub::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#2a7dff;border:2px solid #fff}
#chap{min-width:10.5em} #time{min-width:6.5em;text-align:right;opacity:.75}
@media (max-width:640px){#chap{display:none}#bar{gap:10px;padding:8px 12px}#bar button{min-width:0;padding:9px 10px}}

svg text{font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-kerning:normal}
.lab{letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.navy{fill:#142e61} .blue{fill:#2a7dff} .g1{fill:#525961} .g2{fill:#6d737f}
.a{opacity:0;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:1;stroke-dashoffset:1;fill:none}
#stage *{pointer-events:none}
#marks .mk,#marks .mk *{pointer-events:all;cursor:pointer}
</style>

  var rl=mk('path',{d:'M'+LX(307.5)+' '+y2+'H'+now,stroke:G2,'stroke-width':2,'class':'draw',pathLength:1},v);
  A(rl,{d:[[s+3.8,0],[s+5.6,1,'lin']],o:[[e,1],[e+.4,0]]});
  node(LX(307.5),y2,'Critical','May 22 · orphaned','critRec',s+3.8);
  node(LX(383.5),y2,'Narrowing','Jun 23','nar',s+4.25);
  node(LX(474.5),y2,'Narrowing','Aug 1','nar',s+4.75);
  node(now,y2,'Narrowing','Oct 1','nar',s+5.55,1);
  var ring=mk('circle',{cx:now,cy:y2,r:21,fill:'none',stroke:BLUE,'stroke-width':2.5,'class':'a'},v);
  A(ring,{o:fade(s+5.9,s+6.2,e,e+.4),s:[[s+5.9,2],[s+6.5,1,'out']]});

  var mh=G(),mx=now+60;
  mk('text',{'class':'lab g2',x:mx,y:520,'font-size':12.5,style:'font-weight:400'},mh,'April’s projected milestones');
  A(mh,{o:fade(s+6.3,s+6.8,e,e+.4)});
  [['2026–2030','Treaty negotiation window'],['2027+','Frontier threshold (conditional, projected)'],['Aug 2027','EU AI Act full scope'],['Aug 2030','Infrastructure lock-in']].forEach(function(r,i){
    var g=G(),y=556+i*34,tt=s+6.5+i*.15;
    mk('text',{'class':'lab navy',x:mx,y:y,'font-size':13,style:'letter-spacing:.06em'},g,r[0]);
    mk('text',{x:mx+120,y:y,'font-size':17,fill:G1},g,r[1]);
    A(g,{o:fade(tt,tt+.45,e,e+.4),x:[[tt,12],[tt+.5,0,'out']]});
  });
  A(cap('The longer view',['April projected Critical by late 2026.','At Oct 1 the record reads Narrowing: thin, at the Holding boundary.']),{o:fade(s+.6,s+1.2,e,e+.4)});
}

/* ── per-frame ── */
var ttop=$('ttop'),tbot=$('tbot'),wfill=$('wfill'),phRect=$('phRect'),scRect=$('scRect'),barRect=$('barRect'),ph=$('playhead'),phText=$('phText'),phPill=$('phPill'),mLine=$('mLine'),mLab=$('mLab');
var scrub=$('scrub'),pp=$('pp'),tm=$('time'),chap=$('chap');
var CT=[[96,290],[300,357],[1560,400]],CB=[[96,700],[300,645],[1560,611]];
var MON=['Jul','Aug','Sep'],MLEN=[31,31,30];
function lerp(a,b,m){return a+(b-a)*m}
function pts(P){return 'M'+P.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('L')}

function render(rt){
  var t=tl(rt);
  for(var i=0;i<items.length;i++){
    var it=items[i],p=it.p,st=it.el.style;
    if(p.o)st.opacity=val(p.o,t);
    if(p.d)st.strokeDashoffset=1-val(p.d,t);
    if(p.w)it.el.setAttribute('width',Math.max(0,val(p.w,t)).toFixed(1));
    if(p.x||p.y||p.s||p.sy){
      var x=p.x?val(p.x,t):0,y=p.y?val(p.y,t):0,s=p.s?val(p.s,t):1,sy=p.sy?val(p.sy,t):s;
      st.transform='translate('+x.toFixed(2)+'px,'+y.toFixed(2)+'px) scale('+s.toFixed(4)+','+sy.toFixed(4)+')';
    }
  }
  if(hover){hover.el.style.opacity=1;hover.el.style.transform='none';hover.lead.style.opacity=1}

  /* the window: opens parallel, narrows under the title, then settles into the chart */
  var n=val([[.9,0],[3,1,'io']],t),m=val([[5.1,0],[6.8,1,'io']],t);
  var TT=[[0,170],[307,170+48*n],[1920,170+300*n]],TB=[[0,910],[307,910-48*n],[1920,910-300*n]];
  var PT=TT.map(function(p,i){return [lerp(p[0],CT[i][0],m),lerp(p[1],CT[i][1],m)]});
  var PB=TB.map(function(p,i){return [lerp(p[0],CB[i][0],m),lerp(p[1],CB[i][1],m)]});
  ttop.setAttribute('d',pts(PT));tbot.setAttribute('d',pts(PB));
  wfill.setAttribute('d',pts(PT.concat(PB.slice().reverse()))+'Z');
  var sw=lerp(4,3,m).toFixed(2);ttop.setAttribute('stroke-width',sw);tbot.setAttribute('stroke-width',sw);
  ttop.style.opacity=val([[9.85,1],[10.3,.18],[12.2,.18],[12.65,1]],t);
  tbot.style.opacity=val([[6.9,1],[7.4,.18],[9.4,.18],[9.85,1]],t);

  var px=t<T.h1?val([[.1,0],[1,1920,'io'],[14.6,1920],[15.3,96,'io']],t):val(phK,t);
  phRect.setAttribute('width',px.toFixed(1));barRect.setAttribute('width',t<T.h1?0:px.toFixed(1));
  scRect.setAttribute('width',(264*val([[T.sched+.3,0],[T.sched+1.5,1]],t)).toFixed(1));

  /* playhead + date */
  ph.style.transform='translate('+px.toFixed(1)+'px,0)';
  var lab;
  if(px<300)lab='Jan–Jun';
  else{var d=Math.min(91,Math.max(0,Math.floor((px-300)/13.696))),mi=0;while(d>=MLEN[mi]){d-=MLEN[mi];mi++}lab=MON[mi]+' '+(d+1)}
  if(phText.textContent!==lab)phText.textContent=lab;

  /* gap measure */
  var mx=val([[12.9,300],[14.8,1560,'io']],t),a=top(mx)+8,b=bot(mx)-8;
  mLine.setAttribute('d','M'+(mx-6)+' '+a+'h12M'+mx+' '+a+'V'+b+'M'+(mx-6)+' '+b+'h12');
  mLab.setAttribute('x',mx+14);mLab.setAttribute('y',(a+b)/2+4);
}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function ui(t){
  scrub.value=t;tm.textContent=fmt(t)+' / '+fmt(DUR);
  var n=CH[0][1],u=tl(t);for(var i=0;i<CH.length;i++)if(u>=CH[i][0])n=CH[i][1];chap.textContent=n;
}
function setPlaying(v){playing=v;last=null;pp.textContent=v?'Pause':'Play';pp.setAttribute('aria-label',v?'Pause':'Play');if(v)requestAnimationFrame(tick)}
function tick(now){
  if(!playing)return;
  if(last!=null){t+=Math.min(.1,(now-last)/1000);if(t>=DUR)t=0}
  last=now;render(t);ui(t);requestAnimationFrame(tick);
}
function seek(v){t=Math.max(0,Math.min(DUR,v));render(t);ui(t)}
window.__seek=seek;

pp.addEventListener('click',function(){setPlaying(!playing)});
$('rs').addEventListener('click',function(){seek(0);setPlaying(true)});
scrub.addEventListener('input',function(){if(playing)setPlaying(false);seek(parseFloat(scrub.value))});
document.addEventListener('keydown',function(e){
  if(e.target===scrub)return;
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();setPlaying(!playing)}
  else if(e.code==='ArrowRight'){setPlaying(false);seek(t+1)}
  else if(e.code==='ArrowLeft'){setPlaying(false);seek(t-1)}
});

/* full screen: the way to read it at size when the page column is narrow */
var fs=$('fs'),de=document.documentElement;
var fsReq=de.requestFullscreen||de.webkitRequestFullscreen,fsExit=document.exitFullscreen||document.webkitExitFullscreen;
function fsOn(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
if(fsReq&&fsExit&&(document.fullscreenEnabled||document.webkitFullscreenEnabled)){
  fs.hidden=false;
  fs.addEventListener('click',function(){try{var p=fsOn()?fsExit.call(document):fsReq.call(de);if(p&&p.catch)p.catch(function(){})}catch(e){}});
  var fsLab=function(){fs.textContent=fsOn()?'Exit full screen':'Full screen'};
  document.addEventListener('fullscreenchange',fsLab);document.addEventListener('webkitfullscreenchange',fsLab);
}
try{if(window.self!==window.top)document.body.classList.add('embed')}catch(e){document.body.classList.add('embed')}

function start(){
  init();
  var q=location.search||'';
  if(/export/.test(q)){document.body.classList.add('export');playing=false;seek(0);pp.textContent='Play'}
  else if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){playing=false;seek(T.v+10.5+HOLD_T);setPlaying(false)}
  else{render(0);ui(0);requestAnimationFrame(tick)}
  window.__ready=true;
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start,start);
})();
